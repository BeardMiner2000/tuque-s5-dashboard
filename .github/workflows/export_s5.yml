name: Export S5 Data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-s5
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASHBOARD_SOURCE_URL: ${{ secrets.DASHBOARD_SOURCE_URL }}
      DB_DSN: ${{ secrets.DB_DSN }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
      MAKER_FEE_BPS: ${{ secrets.MAKER_FEE_BPS }}
      TAKER_FEE_BPS: ${{ secrets.TAKER_FEE_BPS }}
      S5_SEASON_ID: ${{ secrets.S5_SEASON_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Export data.json
        run: python export_s5.py

      - name: Commit data.json
        run: |
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: update data.json"
            git push
          else
            echo "No data.json changes to commit."
          fi
