<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUQUE SEASON 5 • LIVE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #0a0a0a; color: #ddd; font-family: system-ui; }
    .header { border-bottom: 3px solid #e11d48; }
    .panel { background: #111; border: 2px solid #222; }
    .race { border: 3px solid #10b981; }
    .pit { border: 3px solid #eab308; background: repeating-linear-gradient(45deg, #111, #111 10px, #1a1a1a 10px, #1a1a1a 20px); }
    .clickable:hover { background: #1f2937; }
    .positive { color: #10b981; }
    .negative { color: #ef4444; }
    .range-btn.active { background: #e11d48; color: white; border-color: #fb7185; }
    .modal-backdrop { background: rgba(0, 0, 0, 0.7); }
    .scrollbar-thin::-webkit-scrollbar { width: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 999px; }
  </style>
</head>
<body class="p-6 max-w-7xl mx-auto">
  <div class="header pb-4 mb-8">
    <div class="flex flex-col gap-4 md:flex-row md:justify-between md:items-end">
      <div>
        <div class="text-6xl font-bold text-white tracking-wider">TUQUE</div>
        <div class="text-2xl text-pink-500 -mt-3">SEASON 5 • PAPER TRADING LIVE</div>
      </div>
      <div class="flex items-center gap-3">
        <div id="rangeControls" class="flex gap-2 text-xs font-semibold">
          <button class="range-btn active px-3 py-2 rounded-lg border border-zinc-700 bg-zinc-900 text-slate-300" data-range="2h">2H</button>
          <button class="range-btn px-3 py-2 rounded-lg border border-zinc-700 bg-zinc-900 text-slate-300" data-range="24h">24H</button>
          <button class="range-btn px-3 py-2 rounded-lg border border-zinc-700 bg-zinc-900 text-slate-300" data-range="7d">7D</button>
          <button class="range-btn px-3 py-2 rounded-lg border border-zinc-700 bg-zinc-900 text-slate-300" data-range="all">ALL</button>
        </div>
        <div class="text-right">
          <div class="text-5xl font-mono text-yellow-400" id="tradeCount">0</div>
          <div class="text-sm text-slate-400">TRADES EXECUTED</div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-6">
    <div class="col-span-12 md:col-span-3 panel p-6 rounded-xl">
      <div class="text-pink-500 font-bold mb-6 text-lg">CURRENT STANDINGS</div>
      <div class="text-xs text-slate-500 mb-4">Click a bot to inspect actual fills and recent trades.</div>
      <div id="standings" class="space-y-4"></div>
    </div>

    <div class="col-span-12 md:col-span-6 race p-6 rounded-2xl">
      <div class="flex items-center justify-between mb-4">
        <div class="text-emerald-400 font-bold">EQUITY RACE (USD)</div>
        <div class="text-xs text-slate-400" id="rangeLabel">Showing last 2 hours</div>
      </div>
      <canvas id="raceChart" height="200"></canvas>
    </div>

    <div class="col-span-12 md:col-span-3 pit p-6 rounded-xl text-yellow-300 text-sm font-mono">
      <div class="font-bold mb-1 text-yellow-400">LIVE ORDERS</div>
      <div class="text-[11px] text-yellow-200 mb-4" id="pitboardLabel">Most recent trades in selected range</div>
      <div id="pitboard" class="space-y-3 overflow-auto h-96 pr-1 scrollbar-thin"></div>
    </div>
  </div>

  <div class="mt-8 panel p-6 rounded-xl">
    <div class="text-slate-400 mb-4" id="configTitle">TRADING CONFIG</div>
    <div id="config" class="text-xs text-slate-500 space-y-2"></div>
  </div>

  <div id="botModal" class="hidden fixed inset-0 z-50 modal-backdrop items-center justify-center p-4">
    <div class="panel w-full max-w-5xl rounded-2xl p-6 max-h-[90vh] overflow-auto">
      <div class="flex items-start justify-between gap-4 mb-6">
        <div>
          <div class="text-2xl font-bold text-white" id="modalBotName">Bot</div>
          <div class="text-sm text-slate-400" id="modalBotMeta">Recent fills and stats</div>
        </div>
        <button id="closeModal" class="px-3 py-2 rounded-lg border border-zinc-700 bg-zinc-900 text-slate-300">Close</button>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6" id="modalStats"></div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-1">
          <div class="text-sm font-bold text-pink-500 mb-3">BOT SNAPSHOT</div>
          <div id="modalHighlights" class="space-y-3"></div>
        </div>
        <div class="md:col-span-2">
          <div class="flex items-center justify-between mb-3">
            <div class="text-sm font-bold text-pink-500">TRADE HISTORY</div>
            <div class="text-xs text-slate-500">Newest first</div>
          </div>
          <div id="modalTradeList" class="space-y-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const RANGE_MS = {
      '2h': 2 * 60 * 60 * 1000,
      '24h': 24 * 60 * 60 * 1000,
      '7d': 7 * 24 * 60 * 60 * 1000,
      'all': null
    };

    let raceChart;
    let bots = [];
    let botsData = {};
    let selectedRange = '2h';

    function parseTs(value) {
      return value ? new Date(value).getTime() : null;
    }

    function filterByRange(rows, rangeKey) {
      if (rangeKey === 'all') return rows.slice();
      const cutoff = Date.now() - RANGE_MS[rangeKey];
      return rows.filter((row) => {
        const ts = parseTs(row.ts);
        return ts && ts >= cutoff;
      });
    }

    function formatSigned(value, digits = 2) {
      return `${value >= 0 ? '+' : ''}${Number(value).toFixed(digits)}`;
    }

    function formatRelativeTime(ts) {
      const ms = Date.now() - parseTs(ts);
      if (!Number.isFinite(ms)) return '';
      const minutes = Math.floor(ms / 60000);
      if (minutes < 1) return 'just now';
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    function prettifyBotName(botId) {
      return botId.replaceAll('_', ' ');
    }

    function prettifyNote(order) {
      if (order.category === 'reserve_refill') return 'Reserve refill';
      if (order.note) return String(order.note).replaceAll('_', ' ');
      if (order.strategy) return String(order.strategy).replaceAll('_', ' ');
      return 'Strategy trade';
    }

    function botMeta(botId) {
      return bots.find((bot) => bot.id === botId) || { color: '#888', emoji: '•', name: prettifyBotName(botId) };
    }

    function sortOrdersForDisplay(orders) {
      return orders.slice().sort((a, b) => {
        const categoryRank = (order) => order.category === 'strategy_trade' ? 0 : 1;
        const categoryDelta = categoryRank(a) - categoryRank(b);
        if (categoryDelta !== 0) return categoryDelta;
        return parseTs(b.ts) - parseTs(a.ts);
      });
    }

    function getFilteredOrders() {
      return filterByRange(botsData.order_history || botsData.recent_orders || [], selectedRange);
    }

    function getFilteredEquityHistory() {
      return filterByRange(botsData.equity_history || [], selectedRange);
    }

    function getBotTradeHistory(botId) {
      const rows = (botsData.orders_by_bot && botsData.orders_by_bot[botId]) || [];
      return filterByRange(rows, selectedRange);
    }

    async function loadSeasonData() {
      try {
        const response = await fetch(`data.json?t=${Date.now()}`);
        const data = await response.json();
        botsData = data;

        bots = data.bots.map((bot) => ({
          id: bot.id,
          name: bot.name,
          emoji: bot.emoji,
          color: bot.color,
          equity: bot.current_equity_usd,
          pnl: bot.current_pnl_usd,
          roi: bot.roi_pct,
          orders: bot.orders_count,
          fills: bot.fills_count,
          positions: bot.active_positions,
          topSymbol: bot.top_symbol || '—'
        }));

        const filteredOrders = getFilteredOrders();
        document.getElementById('tradeCount').textContent = filteredOrders.length || data.summary.total_orders;
        document.getElementById('configTitle').textContent = `TRADING CONFIG • ${data.summary.verified_pairs || 0} VERIFIED PAIRS`;

        const configDiv = document.getElementById('config');
        configDiv.innerHTML = `
          <div><strong>Execution:</strong> ${data.trading_config.execution_mode}</div>
          <div><strong>Coinbase Products:</strong> ${data.trading_config.coinbase_product_count}</div>
          <div><strong>Verified Pairs Traded:</strong> ${data.summary.verified_pairs || 0}</div>
          <div><strong>Fees:</strong> Maker ${data.trading_config.maker_fee_bps} bps | Taker ${data.trading_config.taker_fee_bps} bps</div>
          <div><strong>Product Sample:</strong> ${data.trading_config.coinbase_products_sample.join(', ')}</div>
          <div><strong>Last Updated:</strong> ${new Date(data.meta.last_updated).toLocaleString()}</div>
        `;

        updateRangeText();
        updateStandings();
        updatePitBoard(filteredOrders);
        updateRaceChart();
      } catch (e) {
        console.error("Error loading season data:", e);
      }
    }

    function updateRangeText() {
      const labels = {
        '2h': 'Showing last 2 hours',
        '24h': 'Showing last 24 hours',
        '7d': 'Showing last 7 days',
        'all': 'Showing all exported history'
      };
      document.getElementById('rangeLabel').textContent = labels[selectedRange];
      document.getElementById('pitboardLabel').textContent = `Most recent trades in ${labels[selectedRange].replace('Showing ', '').toLowerCase()}`;
      document.querySelectorAll('.range-btn').forEach((button) => {
        button.classList.toggle('active', button.dataset.range === selectedRange);
      });
    }

    function updateStandings() {
      const div = document.getElementById('standings');
      div.innerHTML = bots
        .slice()
        .sort((a, b) => b.roi - a.roi)
        .map((bot, i) => `
          <button onclick="showBotDetail('${bot.id}')" class="clickable w-full text-left flex justify-between items-center p-4 bg-zinc-950 hover:bg-zinc-900 rounded-xl border border-zinc-700">
            <div class="flex items-center gap-4">
              <span class="text-4xl font-bold text-pink-500">${i + 1}</span>
              <div>
                <div>${bot.emoji} ${bot.name}</div>
                <div class="text-xs text-slate-500">${bot.orders} orders • ${bot.fills} fills</div>
              </div>
            </div>
            <div class="text-right">
              <div class="font-mono text-emerald-400">$${bot.equity.toFixed(2)}</div>
              <div class="${bot.roi >= 0 ? 'positive' : 'negative'} text-xs">${formatSigned(bot.roi)}%</div>
              <div class="text-xs text-slate-500">${bot.topSymbol}</div>
            </div>
          </button>
        `).join('');
    }

    function updatePitBoard(recentOrders) {
      const div = document.getElementById('pitboard');
      if (!recentOrders.length) {
        div.innerHTML = `<div class="py-2 text-slate-400 border-b border-yellow-700 pb-2">No trades in the selected range.</div>`;
        return;
      }

      const displayed = sortOrdersForDisplay(recentOrders)
        .slice(0, 20)
        .map((order) => {
          const bot = botMeta(order.bot_id);
          const sideClass = order.side === 'BUY' ? 'text-emerald-300 border-emerald-600/40 bg-emerald-950/30' : 'text-rose-300 border-rose-600/40 bg-rose-950/30';
          const categoryLabel = order.category === 'reserve_refill' ? 'Reserve' : 'Signal';
          return `
            <div class="rounded-xl border border-yellow-900/70 bg-zinc-950/80 p-3">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <div class="font-bold text-yellow-300">${bot.emoji} ${bot.name}</div>
                  <div class="mt-1 flex items-center gap-2 flex-wrap">
                    <span class="px-2 py-1 rounded-full border text-[10px] ${sideClass}">${order.side}</span>
                    <span class="px-2 py-1 rounded-full border border-yellow-700/60 bg-yellow-950/30 text-[10px] text-yellow-200">${categoryLabel}</span>
                    <span class="text-xs text-slate-300">${order.symbol}</span>
                  </div>
                </div>
                <div class="text-right">
                  <div class="font-mono text-yellow-100">$${Number(order.price || 0).toFixed(6)}</div>
                  <div class="text-[11px] text-slate-500">${formatRelativeTime(order.ts)}</div>
                </div>
              </div>
              <div class="mt-2 text-xs text-slate-400">${prettifyNote(order)}</div>
              <div class="mt-1 text-[11px] text-slate-500">Qty ${Number(order.quantity || 0).toFixed(6)} • Fee $${Number(order.fee || 0).toFixed(4)}</div>
            </div>
          `;
        }).join('');

      const strategyCount = displayed.filter((order) => order.category === 'strategy_trade').length;
      if (strategyCount === 0) {
        div.innerHTML = `
          <div class="rounded-xl border border-yellow-800/70 bg-yellow-950/20 p-3 text-xs text-yellow-100">
            Warmup state: current activity is reserve-refill BTC routing. Strategy entries will surface here as soon as non-plumbing trades land.
          </div>
        ` + div.innerHTML;
      }
    }

    function updateRaceChart() {
      if (!raceChart || bots.length === 0) return;
      const points = getFilteredEquityHistory();
      const timestamps = [...new Set(points.map((point) => point.ts))].sort();
      const labels = timestamps.map((ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
      const grouped = {};
      bots.forEach((bot) => {
        grouped[bot.id] = new Map();
      });

      points.forEach((point) => {
        if (grouped[point.bot_id]) {
          grouped[point.bot_id].set(point.ts, point.equity_usd);
        }
      });

      raceChart.data.labels = labels;
      raceChart.data.datasets = bots.map((bot) => ({
        label: bot.name,
        data: timestamps.map((ts) => grouped[bot.id].get(ts) ?? null),
        borderColor: bot.color,
        backgroundColor: bot.color,
        borderWidth: 3,
        tension: 0.25,
        pointRadius: 0,
        fill: false
      }));
      raceChart.update('none');
    }

    function showBotDetail(id) {
      const bot = bots.find((entry) => entry.id === id);
      if (!bot) return;

      const trades = getBotTradeHistory(id)
        .slice()
        .sort((a, b) => parseTs(b.ts) - parseTs(a.ts));
      const strategyTrades = trades.filter((trade) => trade.category === 'strategy_trade');
      const reserveTrades = trades.filter((trade) => trade.category === 'reserve_refill');
      const uniqueSymbols = [...new Set(trades.map((trade) => trade.symbol))];

      document.getElementById('modalBotName').textContent = `${bot.emoji} ${bot.name}`;
      document.getElementById('modalBotMeta').textContent = `${trades.length} trades in ${selectedRange.toUpperCase()} range • ${strategyTrades.length} strategy, ${reserveTrades.length} reserve`;
      document.getElementById('modalStats').innerHTML = [
        ['Equity', `$${bot.equity.toFixed(2)}`],
        ['P&L', `$${bot.pnl.toFixed(2)}`],
        ['ROI', `${formatSigned(bot.roi)}%`],
        ['Orders', `${bot.orders}`],
        ['Top Symbol', bot.topSymbol]
      ].map(([label, value]) => `
        <div class="rounded-xl border border-zinc-700 bg-zinc-950 p-3">
          <div class="text-[11px] uppercase tracking-wide text-slate-500">${label}</div>
          <div class="text-sm font-semibold text-white mt-1">${value}</div>
        </div>
      `).join('');

      document.getElementById('modalHighlights').innerHTML = [
        ['Active range', selectedRange.toUpperCase()],
        ['Unique pairs', String(uniqueSymbols.length)],
        ['Latest symbol', trades[0]?.symbol || '—'],
        ['Strategy trades', String(strategyTrades.length)],
        ['Reserve refills', String(reserveTrades.length)],
        ['Latest action', prettifyNote(trades[0] || {})]
      ].map(([label, value]) => `
        <div class="rounded-xl border border-zinc-700 bg-zinc-950 p-4">
          <div class="text-[11px] uppercase tracking-wide text-slate-500">${label}</div>
          <div class="mt-1 text-sm font-semibold text-white">${value}</div>
        </div>
      `).join('');

      const tradeList = document.getElementById('modalTradeList');
      if (!trades.length) {
        tradeList.innerHTML = `<div class="rounded-xl border border-zinc-700 bg-zinc-950 p-4 text-slate-400">No trades for this bot in the selected range.</div>`;
      } else {
        tradeList.innerHTML = sortOrdersForDisplay(trades).map((trade) => {
          const sideClass = trade.side === 'BUY' ? 'text-emerald-300 border-emerald-600/40 bg-emerald-950/30' : 'text-rose-300 border-rose-600/40 bg-rose-950/30';
          const categoryClass = trade.category === 'reserve_refill'
            ? 'text-amber-200 border-amber-700/40 bg-amber-950/30'
            : 'text-sky-200 border-sky-700/40 bg-sky-950/30';
          const rationaleParts = [];
          if (trade.rationale?.name) rationaleParts.push(trade.rationale.name);
          if (trade.rationale?.price_change_24h !== undefined) rationaleParts.push(`24h ${Number(trade.rationale.price_change_24h).toFixed(2)}%`);
          if (trade.rationale?.volume_24h !== undefined) rationaleParts.push(`Vol $${Number(trade.rationale.volume_24h).toLocaleString()}`);
          if (trade.rationale?.exit_reason) rationaleParts.push(String(trade.rationale.exit_reason).replaceAll('_', ' '));
          return `
            <div class="rounded-xl border border-zinc-700 bg-zinc-950 p-4">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="px-2 py-1 rounded-full border text-[10px] ${sideClass}">${trade.side}</span>
                    <span class="px-2 py-1 rounded-full border text-[10px] ${categoryClass}">${trade.category === 'reserve_refill' ? 'Reserve refill' : 'Strategy trade'}</span>
                    <span class="font-semibold text-white">${trade.symbol}</span>
                  </div>
                  <div class="mt-2 text-xs text-slate-300">${prettifyNote(trade)}</div>
                  <div class="mt-1 text-[11px] text-slate-500">${rationaleParts.length ? rationaleParts.join(' • ') : 'No extra rationale captured'}</div>
                </div>
                <div class="text-right">
                  <div class="font-mono text-emerald-400">$${Number(trade.price || 0).toFixed(6)}</div>
                  <div class="text-xs text-slate-400">Qty ${Number(trade.quantity || 0).toFixed(6)}</div>
                  <div class="text-[11px] text-slate-500">Fee $${Number(trade.fee || 0).toFixed(4)}</div>
                  <div class="text-[11px] text-slate-500">${new Date(trade.ts).toLocaleString()} • ${formatRelativeTime(trade.ts)}</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      const modal = document.getElementById('botModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function hideBotDetail() {
      const modal = document.getElementById('botModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.getElementById('closeModal').addEventListener('click', hideBotDetail);
    document.getElementById('botModal').addEventListener('click', (event) => {
      if (event.target.id === 'botModal') hideBotDetail();
    });
    document.getElementById('rangeControls').addEventListener('click', (event) => {
      const button = event.target.closest('[data-range]');
      if (!button) return;
      selectedRange = button.dataset.range;
      updateRangeText();
      if (botsData.summary) {
        const filteredOrders = getFilteredOrders();
        document.getElementById('tradeCount').textContent = filteredOrders.length || botsData.summary.total_orders;
        updatePitBoard(filteredOrders);
        updateRaceChart();
      }
    });

    loadSeasonData();
    raceChart = new Chart(document.getElementById('raceChart'), {
      type: 'line',
      data: { labels: [], datasets: [] },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: '#222' } },
          x: { grid: { color: '#151515' }, ticks: { color: '#888' } }
        }
      }
    });

    setInterval(() => {
      loadSeasonData();
    }, 30000);
  </script>
</body>
</html>
