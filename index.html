<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUQUE SEASON 5 • LIVE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #0a0a0a; color: #ddd; font-family: system-ui; }
    .header { border-bottom: 3px solid #e11d48; }
    .panel { background: #111; border: 2px solid #222; }
    .race { border: 3px solid #10b981; }
    .pit { border: 3px solid #eab308; background: repeating-linear-gradient(45deg, #111, #111 10px, #1a1a1a 10px, #1a1a1a 20px); }
    .clickable:hover { background: #1f2937; }
    .positive { color: #10b981; }
    .negative { color: #ef4444; }
  </style>
</head>
<body class="p-6 max-w-7xl mx-auto">
  <div class="header pb-4 mb-8">
    <div class="flex justify-between items-end">
      <div>
        <div class="text-6xl font-bold text-white tracking-wider">TUQUE</div>
        <div class="text-2xl text-pink-500 -mt-3">SEASON 5 • PAPER TRADING LIVE</div>
      </div>
      <div class="text-right">
        <div class="text-5xl font-mono text-yellow-400" id="tradeCount">0</div>
        <div class="text-sm text-slate-400">TRADES EXECUTED</div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-6">
    <div class="col-span-12 md:col-span-3 panel p-6 rounded-xl">
      <div class="text-pink-500 font-bold mb-6 text-lg">CURRENT STANDINGS</div>
      <div class="text-xs text-slate-500 mb-4">Capital: $1500 USD per bot</div>
      <div id="standings" class="space-y-4"></div>
    </div>

    <div class="col-span-12 md:col-span-6 race p-6 rounded-2xl">
      <div class="text-emerald-400 font-bold mb-4">EQUITY RACE (USD)</div>
      <canvas id="raceChart" height="200"></canvas>
    </div>

    <div class="col-span-12 md:col-span-3 pit p-6 rounded-xl text-yellow-300 text-sm font-mono">
      <div class="font-bold mb-4 text-yellow-400">LIVE ORDERS</div>
      <div id="pitboard" class="space-y-3 overflow-auto h-96"></div>
    </div>
  </div>

  <div class="mt-8 panel p-6 rounded-xl">
    <div class="text-slate-400 mb-4">TRADING CONFIG • 9 VERIFIED PAIRS</div>
    <div id="config" class="text-xs text-slate-500 space-y-2"></div>
  </div>

  <script>
    let raceChart;
    let bots = [];
    let botsData = {};

    async function loadSeasonData() {
      try {
        const response = await fetch('data.json');
        const data = await response.json();
        botsData = data;
        
        bots = data.bots.map((bot, idx) => ({
          id: bot.id,
          name: bot.name,
          emoji: bot.emoji,
          color: bot.color,
          equity: bot.current_equity_usd,
          pnl: bot.current_pnl_usd,
          roi: bot.roi_pct,
          orders: bot.orders_count,
          fills: bot.fills_count,
          positions: bot.active_positions
        }));
        
        // Show config
        const configDiv = document.getElementById('config');
        configDiv.innerHTML = `
          <div><strong>Execution:</strong> ${data.trading_config.execution_mode}</div>
          <div><strong>Symbols:</strong> ${data.trading_config.symbols.join(', ')}</div>
          <div><strong>Fees:</strong> Maker ${data.trading_config.maker_fee} | Taker ${data.trading_config.taker_fee}</div>
          <div><strong>Last Updated:</strong> ${new Date(data.meta.last_updated).toLocaleString()}</div>
        `;
        
        updateStandings();
        updatePitBoard();
      } catch(e) {
        console.error("Error loading season data:", e);
        // Fallback to demo data
        bots = [
          {id:'loser_reversal_hunter', name:'LOSER REVERSAL', emoji:'🚀', color:'#10b981', equity:1500, pnl:0, roi:0.0, orders:0, fills:0, positions:0},
          {id:'chaos_prophet', name:'CHAOS PROPHET', emoji:'🌪️', color:'#eab308', equity:1500, pnl:0, roi:0.0, orders:0, fills:0, positions:0},
          {id:'pump_surfer', name:'PUMP SURFER', emoji:'🏄', color:'#3b82f6', equity:1500, pnl:0, roi:0.0, orders:0, fills:0, positions:0},
          {id:'obsidian_flux', name:'OBSIDIAN FLUX', emoji:'⚫', color:'#ec4899', equity:1500, pnl:0, roi:0.0, orders:0, fills:0, positions:0}
        ];
        updateStandings();
      }
    }

    function updateStandings() {
      const div = document.getElementById('standings');
      div.innerHTML = bots
        .sort((a, b) => b.roi - a.roi)
        .map((bot, i) => `
        <div onclick="showBotDetail('${bot.id}')" class="clickable flex justify-between items-center p-4 bg-zinc-950 hover:bg-zinc-900 rounded-xl border border-zinc-700">
          <div class="flex items-center gap-4">
            <span class="text-4xl font-bold text-pink-500">${i+1}</span>
            <div>
              <div>${bot.emoji} ${bot.name}</div>
              <div class="text-xs text-slate-500">${bot.orders} orders</div>
            </div>
          </div>
          <div class="text-right">
            <div class="font-mono text-emerald-400">$${bot.equity.toFixed(2)}</div>
            <div class="${bot.roi >= 0 ? 'positive' : 'negative'} text-xs">${bot.roi >= 0 ? '+' : ''}${bot.roi.toFixed(2)}%</div>
          </div>
        </div>
      `).join('');
    }

    function updatePitBoard() {
      const div = document.getElementById('pitboard');
      const topBots = bots.sort((a, b) => b.orders - a.orders).slice(0, 4);
      
      if (bots[0].orders === 0) {
        div.innerHTML = `
          <div class="py-1 text-slate-400 border-b border-yellow-700 pb-2">WAITING FOR ENTRY SIGNALS</div>
          <div class="py-1 text-slate-300">🚀 LOSER_REVERSAL_HUNTER ready</div>
          <div class="py-1 text-slate-300">🌪️ CHAOS_PROPHET ready</div>
          <div class="py-1 text-slate-300">🏄 PUMP_SURFER ready</div>
          <div class="py-1 text-slate-300">⚫ OBSIDIAN_FLUX ready</div>
        `;
        return;
      }
      
      div.innerHTML = topBots.map(b => `
        <div class="py-2 border-b border-yellow-900">
          <div class="font-bold text-yellow-300">${b.emoji} ${b.name}</div>
          <div class="text-slate-400 text-xs">Orders: ${b.orders} | Fills: ${b.fills}</div>
        </div>
      `).join('');
    }

    function showBotDetail(id) {
      const bot = bots.find(b => b.id === id);
      if (!bot) return;
      alert(`${bot.emoji} ${bot.name}\\nEquity: $${bot.equity.toFixed(2)} USD\\nP&L: $${bot.pnl.toFixed(2)} (${bot.roi.toFixed(2)}%)\\nOrders: ${bot.orders} | Fills: ${bot.fills}\\nActive Positions: ${bot.positions}`);
    }

    // Init
    loadSeasonData();
    raceChart = new Chart(document.getElementById('raceChart'), {
      type: 'line',
      data: { 
        labels: Array(50).fill(''), 
        datasets: bots.map(b => ({
          label: b.name, 
          data: Array(50).fill(b.equity), 
          borderColor: b.color, 
          borderWidth: 3, 
          tension: 0.4,
          fill: false
        })) 
      },
      options: { 
        responsive: true, 
        plugins: { legend: { display: false } }, 
        scales: { 
          y: { grid: { color: '#222' }}, 
          x: { display: false } 
        } 
      }
    });

    // Refresh every 30 seconds
    setInterval(() => {
      loadSeasonData();
      if (raceChart && bots.length > 0) {
        raceChart.data.datasets.forEach((ds, idx) => {
          ds.data.shift();
          const bot = bots[idx];
          // Simulate slight drift
          ds.data.push(bot.equity * (0.999 + Math.random()*0.002));
        });
        raceChart.update('none');
      }
    }, 30000);
  </script>
</body>
</html>
